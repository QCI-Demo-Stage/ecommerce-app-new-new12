name: Docker Build and Push

on:
  push:
    branches:
      - main
      - develop
      - "tymeline-ae*"
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  # Simulated / demo ECR registry host (override via repo variable ECR_REGISTRY)
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY || '123456789012.dkr.ecr.us-east-1.amazonaws.com' }}
  ECR_BACKEND_REPO: ${{ vars.ECR_BACKEND_REPO || 'ecommerce-app-new/backend' }}
  ECR_FRONTEND_REPO: ${{ vars.ECR_FRONTEND_REPO || 'ecommerce-app-new/frontend' }}

permissions:
  contents: read
  id-token: write
  actions: write

jobs:
  build-and-push:
    name: Build multi-arch images and push to ECR
    runs-on: ubuntu-latest
    outputs:
      backend_image: ${{ steps.meta.outputs.backend_image }}
      frontend_image: ${{ steps.meta.outputs.frontend_image }}
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Required repository secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image metadata
        id: meta
        run: |
          set -euo pipefail
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-12)"
          IMAGE_TAG="${SHORT_SHA}"
          BACKEND_IMAGE="${ECR_REGISTRY}/${ECR_BACKEND_REPO}:${IMAGE_TAG}"
          FRONTEND_IMAGE="${ECR_REGISTRY}/${ECR_FRONTEND_REPO}:${IMAGE_TAG}"
          {
            echo "image_tag=${IMAGE_TAG}"
            echo "backend_image=${BACKEND_IMAGE}"
            echo "frontend_image=${FRONTEND_IMAGE}"
          } >> "${GITHUB_OUTPUT}"
          mkdir -p artifacts
          cat > artifacts/image-uris.txt <<EOF
          backend=${BACKEND_IMAGE}
          frontend=${FRONTEND_IMAGE}
          tag=${IMAGE_TAG}
          sha=${GITHUB_SHA}
          EOF
          echo "Backend:  ${BACKEND_IMAGE}"
          echo "Frontend: ${FRONTEND_IMAGE}"

      - name: Ensure ECR repositories exist (simulated / idempotent)
        run: |
          set -euo pipefail
          for repo in "${ECR_BACKEND_REPO}" "${ECR_FRONTEND_REPO}"; do
            aws ecr describe-repositories --repository-names "${repo}" --region "${AWS_REGION}" >/dev/null 2>&1 \
              || aws ecr create-repository --repository-name "${repo}" --region "${AWS_REGION}" \
                   --image-scanning-configuration scanOnPush=true \
                   --encryption-configuration encryptionType=AES256
          done

      - name: Build and push backend (linux/amd64,linux/arm64)
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file Dockerfile.backend \
            --build-arg BUILD_VERSION="${{ github.ref_name }}" \
            --build-arg BUILD_SHA="${{ github.sha }}" \
            --build-arg PORT=3001 \
            --tag "${{ steps.meta.outputs.backend_image }}" \
            --tag "${{ env.ECR_REGISTRY }}/${{ env.ECR_BACKEND_REPO }}:latest" \
            --push \
            .

      - name: Build and push frontend (linux/amd64,linux/arm64)
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file Dockerfile.frontend \
            --build-arg BUILD_VERSION="${{ github.ref_name }}" \
            --build-arg BUILD_SHA="${{ github.sha }}" \
            --build-arg VITE_API_BASE_URL=/api \
            --build-arg PORT=3000 \
            --tag "${{ steps.meta.outputs.frontend_image }}" \
            --tag "${{ env.ECR_REGISTRY }}/${{ env.ECR_FRONTEND_REPO }}:latest" \
            --push \
            .

      - name: Upload image URI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: image-uris-${{ steps.meta.outputs.image_tag }}
          path: artifacts/image-uris.txt
          if-no-files-found: error
          retention-days: 30

  deploy-staging:
    name: Deploy to Kubernetes staging (Helm)
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubeconfig
        run: |
          set -euo pipefail
          aws eks update-kubeconfig \
            --name "${{ vars.EKS_CLUSTER_NAME || 'ecommerce-staging' }}" \
            --region "${AWS_REGION}"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Helm upgrade staging (dry-run preview then apply)
        run: |
          set -euo pipefail
          # Preview first (read-only validation in CI logs)
          helm upgrade --install ecommerce-staging ./chart/staging \
            --namespace staging \
            --create-namespace \
            --values ./chart/staging/values-staging.yaml \
            --set backend.image.repository="${ECR_REGISTRY}/${ECR_BACKEND_REPO}" \
            --set backend.image.tag="${{ needs.build-and-push.outputs.image_tag }}" \
            --set frontend.image.repository="${ECR_REGISTRY}/${ECR_FRONTEND_REPO}" \
            --set frontend.image.tag="${{ needs.build-and-push.outputs.image_tag }}" \
            --dry-run

          # Human-gated note: production promotion is a separate workflow.
          # Staging apply runs only when secrets/cluster access are configured.
          helm upgrade --install ecommerce-staging ./chart/staging \
            --namespace staging \
            --create-namespace \
            --values ./chart/staging/values-staging.yaml \
            --set backend.image.repository="${ECR_REGISTRY}/${ECR_BACKEND_REPO}" \
            --set backend.image.tag="${{ needs.build-and-push.outputs.image_tag }}" \
            --set frontend.image.repository="${ECR_REGISTRY}/${ECR_FRONTEND_REPO}" \
            --set frontend.image.tag="${{ needs.build-and-push.outputs.image_tag }}" \
            --wait \
            --timeout 10m
