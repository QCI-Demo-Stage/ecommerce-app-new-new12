# Staging environment overrides for chart/staging
# Used by CI: helm upgrade --install ... -f chart/staging/values-staging.yaml

replicaCount:
  frontend: 2
  backend: 2

image:
  frontend:
    # repository and tag are injected by the docker-build workflow
    repository: "000000000000.dkr.ecr.us-east-1.amazonaws.com/ecommerce-frontend"
    tag: "staging"
    pullPolicy: Always
  backend:
    repository: "000000000000.dkr.ecr.us-east-1.amazonaws.com/ecommerce-backend"
    tag: "staging"
    pullPolicy: Always

resources:
  frontend:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  backend:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: staging.ecommerce.example.com
      paths:
        - path: /
          pathType: Prefix
          service: frontend
        - path: /api
          pathType: Prefix
          service: backend

env:
  backend:
    NODE_ENV: staging
  frontend: {}
