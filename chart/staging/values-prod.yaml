# Production overrides for Ecommerce App New.
# Usage (human-approved apply withheld in CI — dry-run / template only):
#   helm upgrade --install ecommerce-prod ./chart/staging \
#     --namespace prod \
#     -f ./chart/staging/values-prod.yaml \
#     --set backend.image.tag=<tag> \
#     --set frontend.image.tag=<tag>

backend:
  replicaCount: 3
  image:
    repository: 123456789012.dkr.ecr.us-east-1.amazonaws.com/ecommerce-backend
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  probes:
    liveness:
      path: /health
      initialDelaySeconds: 20
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      path: /ready
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
  env:
    - name: NODE_ENV
      value: production
    - name: PORT
      value: "3000"

frontend:
  replicaCount: 3
  image:
    repository: 123456789012.dkr.ecr.us-east-1.amazonaws.com/ecommerce-frontend
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  probes:
    liveness:
      path: /health
      initialDelaySeconds: 10
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      path: /ready
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
  env:
    - name: NODE_ENV
      value: production
    - name: PORT
      value: "8080"

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: ecommerce.example.com
      paths:
        - path: /api
          pathType: Prefix
          service: backend
        - path: /
          pathType: Prefix
          service: frontend
  tls:
    - secretName: ecommerce-prod-tls
      hosts:
        - ecommerce.example.com

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: "/metrics"
